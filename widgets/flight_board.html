<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light dark;--ink:var(--tg-theme-text-color,#243b30);--paper:var(--tg-theme-bg-color,#f7f8f2);--surface:var(--tg-theme-secondary-bg-color,#e9eee3);--hint:var(--tg-theme-hint-color,#7b8779);--accent:var(--tg-theme-link-color,#427b50)}*{box-sizing:border-box}body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif;font-size:14px}.board{padding:18px 16px 14px;overflow:hidden}.top,.foot,.specs,.instrument{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:750;font-size:17px;letter-spacing:-.7px}.brand span{color:var(--accent)}.tag{font-size:8px;letter-spacing:1.3px;color:var(--hint);display:flex;align-items:center;gap:6px}.dot{width:5px;height:5px;border:1px solid var(--accent);border-radius:50%;animation:ping 2s ease-in-out 3}.eyebrow{font-size:8px;letter-spacing:1.7px;color:var(--hint);margin:19px 0 9px}.flaps{display:flex;gap:3px;position:relative;overflow:hidden;padding:7px;background:var(--ink);border-radius:8px}.flaps:after{content:"";position:absolute;left:7px;right:7px;top:50%;height:1px;background:var(--paper);pointer-events:none}.tile{display:flex;align-items:center;justify-content:center;flex:1;min-width:0;height:45px;border:1px solid var(--hint);border-radius:3px;background:var(--ink);color:var(--paper);font-family:ui-monospace,monospace;font-size:clamp(18px,6vw,27px);font-weight:700;transform-origin:center;animation:flap .48s ease-out both}.instrument{height:35px;color:var(--accent);gap:7px}.runway{flex:1;height:0;border-top:1px dashed var(--hint);position:relative}.plane{width:27px;height:27px;animation:arrive 1.5s ease-out both}.instrument small{font-size:8px;letter-spacing:1.3px;color:var(--hint);white-space:nowrap}.route{font-size:20px;line-height:1.3;font-weight:600;letter-spacing:-.7px;overflow-wrap:anywhere;margin:0}.route.long{font-size:13px}.model{color:var(--hint);font-size:11px;margin:7px 0 16px;overflow-wrap:anywhere}.specs{gap:6px;align-items:stretch}.spec{background:var(--surface);border-radius:7px;padding:11px 9px;flex:1;min-width:0}.spec label{display:block;font-size:7px;letter-spacing:1.3px;color:var(--hint);margin-bottom:7px}.value{font-family:ui-monospace,monospace;font-size:clamp(16px,5vw,23px);font-weight:600;letter-spacing:-1px}.unit{font-size:8px;color:var(--hint);margin-top:3px}.foot{margin-top:14px;padding-bottom:max(0px,env(safe-area-inset-bottom));padding-right:var(--tg-content-safe-area-corner-right,0px);font-size:8px;gap:8px;color:var(--hint)}.foot button{border:0;background:transparent;color:var(--accent);font-family:system-ui,sans-serif;font-size:9px;padding:3px 0;cursor:pointer}.foot span:last-child{text-align:right}.sources{font-size:7px;color:var(--hint);margin-top:7px;line-height:1.4}.change{animation:reveal .45s ease-out}@keyframes flap{0%{transform:scaleY(.08)}55%{transform:scaleY(1.06)}100%{transform:scaleY(1)}}@keyframes arrive{from{transform:translateX(-45px) rotate(-15deg)}to{transform:translateX(0) rotate(0)}}@keyframes reveal{from{transform:translateY(5px)}to{transform:translateY(0)}}@keyframes ping{50%{transform:scale(1.6)}100%{transform:scale(1)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-width:280px){.board{padding:14px 11px}.tag{letter-spacing:.5px;font-size:7px}.route{font-size:17px}.route.long{font-size:12px}.tile{height:38px}.spec{padding:9px 6px}}
</style></head><body><main class="board"><header class="top"><div class="brand">↗ airways<span>.</span></div><div class="tag"><i class="dot"></i>PASSING NEARBY</div></header><p class="eyebrow">FLIGHT IN YOUR AIRSPACE</p><div class="flaps" id="flight" aria-label="Flight callsign"></div><div class="instrument"><span class="runway"></span><svg class="plane" viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M29 14 19 10 18 3 15 2 14 12 5 9 2 11 13 17 12 24 7 24 5 27 14 28 20 27 20 25 17 24 18 18 28 17Z"/></svg><span class="runway"></span><small>IN FLIGHT</small></div><h1 class="route" id="route">Route unavailable</h1><p class="model" id="model">Aircraft unavailable</p><section class="specs"><div class="spec"><label>ALTITUDE</label><span class="value" id="altitude">—</span><div class="unit">METRES</div></div><div class="spec"><label>GROUND SPEED</label><span class="value" id="speed">—</span><div class="unit">KM/H</div></div><div class="spec"><label>DISTANCE</label><span class="value" id="distance">—</span><div class="unit">KM AWAY</div></div></section><footer class="foot"><button id="replay" type="button">↻ Replay board</button><span id="time">—</span></footer><div class="sources">OpenSky · adsbdb / Route matches may be outdated.</div></main><script>
const W=window.TelegramWidget;
const sample={c:'TAP123',r:'Lisbon → London',a:'Boeing 737-800',h:'9,100',v:'720',d:'4.2',t:'16:42 UTC'};
function draw(){let data={};try{data=W?JSON.parse(W.chatData||'{}'):sample}catch(e){}
const flight=document.getElementById('flight');flight.textContent='';
const callsign=String(data.c||'UNKNOWN').toUpperCase();
flight.setAttribute('aria-label','Flight '+callsign);
Array.from(callsign).slice(0,12).forEach((char,index)=>{const tile=document.createElement('span');tile.className='tile';tile.textContent=char;tile.style.animationDelay=index*32+'ms';flight.appendChild(tile)});
[['route','r','Route unavailable'],['model','a','Aircraft unavailable'],['altitude','h','—'],['speed','v','—'],['distance','d','—'],['time','t','—']].forEach(([id,key,fallback])=>{const node=document.getElementById(id);node.textContent=String(data[key]||fallback);if(id==='route'){node.classList.toggle('long',node.textContent.length>60)}});
}
document.getElementById('replay').addEventListener('click',draw);if(W){W.onEvent('chatDataChanged',draw)}draw();if(W){W.ready()}
</script></body></html>
